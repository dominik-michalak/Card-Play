  - generic [ref=f15e1308]:
    - heading "Darmowe gry online na Gry.pl" [level=1] [ref=f15e1309]
    - generic [ref=f15e1310]:
      - paragraph [ref=f15e1311]: Czołem, graczu! Witaj na stronie Gry.pl!
      - paragraph [ref=f15e1312]:
        - text: Znajdziesz tu tysiące
        - strong [ref=f15e1313]: gier online
        - text: – zarówno przeznaczonych dla jednego gracza, jak i do rozgrywek wieloosobowych. Możesz w nie grać także na urządzeniach mobilnych. Wypróbuj je na laptopie, smartfonie lub tablecie. Mamy coś dla graczy w każdym wieku, więc bez względu na to, ile masz lat, na pewno znajdziesz grę, przy której będziesz się świetnie bawić!
      - heading "Bez pobierania i bez płatnych subskrypcji – aby zagrać, wystarczy jedno kliknięcie!" [level=3] [ref=f15e1314]
      - paragraph [ref=f15e1315]:
        - text: "Zanurz się w świecie ulubionych gier bez konieczności ich pobierania lub kupowania subskrypcji. Po prostu kliknij grę, aby w nią zagrać! Zacznij od tytułów stworzonych przez nas, takich jak:"
        - link "Fireboy and Watergirl" [ref=f15e1316] [cursor=pointer]:
          - /url: https://www.gry.pl/gry/fireboy-and-watergirl
        - text: ","
        - link "Troll Face Quest" [ref=f15e1317] [cursor=pointer]:
          - /url: https://www.gry.pl/gry/gry-wyprawa-antytrollowa
        - text: ","
        - link "Uphill Rush" [ref=f15e1318] [cursor=pointer]:
          - /url: https://www.gry.pl/gry/gry-uphill-rush
        - text: i
        - link "Bob the Robber" [ref=f15e1319] [cursor=pointer]:
          - /url: https://www.gry.pl/gra/zlodziej-bob
        - text: .
      - paragraph [ref=f15e1320]:
        - text: "W naszej bibliotece znajdziesz także popularne tytuły, takie jak: Scary Maze,"
        - link "Ludo Legend" [ref=f15e1321] [cursor=pointer]:
          - /url: https://www.gry.pl/gra/legenda-ludo
        - text: ","
        - link "Shell Shockers" [ref=f15e1322] [cursor=pointer]:
          - /url: https://www.gry.pl/gra/shellshockio
        - text: ", The Impossible Quiz i wiele innych!"
      - heading "Zostań członkiem społeczności graczy!" [level=3] [ref=f15e1323]
      - paragraph [ref=f15e1324]:
        - text: Chcesz zyskać nowych znajomych w trakcie rozgrywki? Stwórz konto i graj w tytuły pokroju
        - link "Family Barn" [ref=f15e1325] [cursor=pointer]:
          - /url: https://www.gry.pl/gra/wiejskie-zycie
        - text: lub Goodgame Empire. W obu czekają na ciebie tętniące życiem społeczności liczące tysiące graczy. Ponadto zaliczają się one do grona najlepszych gier MMO wszech czasów i zawierają mnóstwo funkcji społecznościowych, które musisz wypróbować.
      - heading "Nasze najpopularniejsze kategorie!" [level=3] [ref=f15e1326]
      - paragraph [ref=f15e1327]:
        - text: Mamy do zaoferowania setki gatunków gier – dla każdego coś miłego. Wypróbuj nasze wspaniałe
        - link "łamigłówki" [ref=f15e1328] [cursor=pointer]:
          - /url: https://www.gry.pl/gry/logiczne
        - text: ","
        - link "pasjanse" [ref=f15e1329] [cursor=pointer]:
          - /url: https://www.gry.pl/gry/solitaire
        - text: oraz
        - link "gry z serii .io" [ref=f15e1330] [cursor=pointer]:
          - /url: https://www.gry.pl/gry/gry-io
        - text: . Miłośnicy i miłośniczki mody w każdym wieku pokochają nasze
        - link "ubieranki" [ref=f15e1331] [cursor=pointer]:
          - /url: https://www.gry.pl/gry/ubieranki
        - text: . A jeśli chcesz poczuć ducha rywalizacji, rzuć wyzwanie znajomemu w jednej z gier dla dwóch graczy lub przekonaj się, czy zdołasz jako pierwszy pokonać linię mety w naszych trzymających w napięciu
        - link "ścigankach" [ref=f15e1332] [cursor=pointer]:
          - /url: https://www.gry.pl/gry/wyscigi
        - text: .
      - heading "O nas" [level=3] [ref=f15e1333]
      - paragraph [ref=f15e1334]: Każdego miesiąca nasze strony internetowe odwiedza ponad 35 milionów graczy z ponad 150 krajów. Od 2014 roku nasze gry zostały uruchomione ponad 19 miliardów razy!
      - paragraph [ref=f15e1335]: Udało nam się przyciągnąć miliony graczy do serii takich jak Bubble Shooter, MahJongCon, Sara's Cooking Class i Happy Wheels. Dzięki naszej pomocy gry te stały się kultowymi tytułami internetowymi.
      - paragraph [ref=f15e1336]:
        - generic [ref=f15e1337]:
          - text: "Możemy także pochwalić się dziesiątkami innych stron internetowych, w tym:"
          - link "Agame" [ref=f15e1338] [cursor=pointer]:
            - /url: https://www.agame.com/
          - text: ","
          - link "Gamesgames" [ref=f15e1339] [cursor=pointer]:
            - /url: https://www.gamesgames.com/
          - text: ","
          - link "A10" [ref=f15e1340] [cursor=pointer]:
            - /url: https://www.a10.com/
          - text: oraz
          - link "Mousebreaker" [ref=f15e1341] [cursor=pointer]:
            - /url: https://www.mousebreaker.com/
          - text: . Mamy też inne strony dostępne w wielu różnych językach.
