# The whole application: database, server and the web client behind nginx.
#
#   npm run app:up       build and start (needs the secrets of .env)
#   npm run app:down     stop it
#   npm run app:smoke    check the running stack
#
# The scripts use their own project name (cardplay-app), so this stack never touches the
# development database started by docker-compose.yml or any other container.
name: cardplay-app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      # the address the browser uses; the server accepts state-changing requests only from it
      CLIENT_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # one proxy (the client container) stands between the browser and the server
      TRUST_PROXY: 1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  app_postgres_data:
