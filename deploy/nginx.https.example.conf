# An example of the reverse proxy that terminates TLS in front of the `client` container.
# Adjust the names, the certificate paths and the upstream address, then test with `nginx -t`.
# It is not used by the compose stack.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name your.domain;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name your.domain;

  ssl_certificate     /etc/ssl/your.domain/fullchain.pem;
  ssl_certificate_key /etc/ssl/your.domain/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    # the client container of compose.app.yml, published only on this machine
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # sockets
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
